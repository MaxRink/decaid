# Android versionCode: a committed, monotonically increasing counter.
#
# Read by android/app/build.gradle.kts and flutter_with_commit.sh. It lives in
# version control instead of being derived from git history so that the same
# commit produces the same versionCode everywhere -- full clone, `git clone
# --depth 1` CI checkout, or an exported source tree with no .git at all.
#
# HOW TO BUMP (once per release, in the release commit):
#   1. Increase the number below by 1 for each release you ship, e.g. 3295 ->
#      3296. Skipping releases is fine as long as the number only ever grows.
#   2. Never decrease or reuse it: Android refuses to install an APK whose
#      versionCode is lower than the already installed one.
#   3. Commit it with the release change, e.g.
#        "chore(android): bump versionCode to 3296"
#
# MIGRATION NOTE: 3295 is the value the previous formula
# (`git rev-list --count origin/main`) produced at the commit that introduced
# this file, so devices upgrading from a pre-migration build see no downgrade.
versionCode=3295
