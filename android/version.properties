# Android versionCode: a committed, monotonically increasing counter.
#
# Read by android/app/build.gradle.kts and flutter_with_commit.sh. It lives in
# version control instead of being derived from git history so that the same
# commit produces the same versionCode everywhere -- full clone, `git clone
# --depth 1` CI checkout, or an exported source tree with no .git at all.
#
# Only ever increases. Android refuses to install an APK whose versionCode is
# lower than the installed one, so a decrease breaks in-place updates.
#
# HOW TO BUMP and why this number is what it is: see doc/RELEASE.md,
# section "Android versionCode". scripts/check_version_code_bump.sh enforces
# the rule in CI -- on every PR and before every tagged release build -- against
# the highest versionCode of the newest published release APKs, pre-releases
# included, and it fails rather than skips when no reference can be read.
#
# Value history:
#   3600  introduced with this file. 3295 was upstream origin/main's
#         `git rev-list --count` when the change was written; 3600 keeps 305
#         commits of headroom above it (more than the 274 commits upstream
#         main received in the previous 30 days) so that main advancing before
#         this lands cannot produce a lower versionCode than a build of main.
#         The highest published release APK is v0.9.3 at 3265; the newest
#         pre-release, v0.9.3-beta.2, is 3244, so pre-releases do not raise
#         the reference above 3265.
versionCode=3600
